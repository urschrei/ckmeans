version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 20
    groups:
      cargo-dependencies:
        applies-to: version-updates
        patterns:
          - "*"
      cargo-dependencies-security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      gha-updates:
        applies-to: version-updates
        patterns:
          - "*"
      gha-updates-security:
        applies-to: security-updates
        patterns:
          - "*"
